version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn auth_service.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - SECRET_KEY=karyasetu_secret_123

  attendance_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn attendance_service.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017

  ai_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn ai_service.main:app --host 0.0.0.0 --port 8000

  dashboard_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn dashboard_service.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - attendance_service
      - ai_service
      - dashboard_service

volumes:
  mongo_data:
